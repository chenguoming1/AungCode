# Active provider. Override at runtime with AGENT_PROVIDER=openai
provider = "github"

# Where session transcripts live. Defaults to ~/.aungcode/sessions.
# AGENT_SESSION_DIR overrides this for a single run.
# session_dir = "~/.aungcode/sessions"

# max_tokens caps a single response. You are billed for tokens generated, not
# for the cap, so a generous value costs nothing until it is used. The values
# below are deliberately below each model's ceiling (noted per profile) — a
# runaway response at the true maximum would be slow and expensive.
#
# context_window drives compaction, which fires at 75% of it. Setting it too
# low only compacts earlier than needed; setting it too high overruns the real
# limit and fails hard. When unsure, go low.

[providers.anthropic]
kind = "anthropic"
model = "claude-opus-4-8"
api_key_env = "ANTHROPIC_API_KEY"
# Model ceiling: 128000 output, 1M context.
max_tokens = 64000
context_window = 1000000
# USD per million tokens. Leave all four at 0 (or omit) when pricing is
# unknown or free — the usage line then shows no cost rather than a wrong one.
price_in = 5.00
price_out = 25.00
price_cache_read = 0.50
price_cache_write = 6.25

[providers.openai]
kind = "openai"
model = "gpt-5"
api_key_env = "OPENAI_API_KEY"
# Unverified against OpenAI's direct API — conservative figures. Raise once
# you have checked the limits for your account and model.
max_tokens = 32768
context_window = 200000
# Newer OpenAI models reject `max_tokens` and want this instead.
token_param = "max_completion_tokens"

[providers.deepseek]
kind = "openai"
model = "deepseek-v4-flash"
api_key_env = "DEEPSEEK_API_KEY"
base_url = "https://api.deepseek.com"
# Model ceiling: 384000 output, 1M context (api-docs.deepseek.com pricing).
max_tokens = 32768
context_window = 1000000
# USD per 1M tokens, from api-docs.deepseek.com/quick_start/pricing
# (cache miss / output / cache hit).
price_in = 0.14
price_out = 0.28
price_cache_read = 0.0028

# Local OpenAI-compatible server (MLX, llama.cpp, Ollama, vLLM, LM Studio).
# No secret to protect, so the key is inline rather than an env var — most
# local servers ignore it entirely but the SDK requires something non-empty.
# No prices: nothing is billed, so no cost is reported.
# context_window should match how the server was started; too low only means
# compaction fires early, too high fails hard.
# MLX on this machine.
[providers.local]
kind = "openai"
# Must match what the server reports at GET <base_url>/models, exactly.
model = "mlx-community/Qwen3-Coder-30B-A3B-Instruct-4bit-dwq-v2"
api_key_env = "LOCAL_API_KEY"
base_url = "http://127.0.0.1:8080/v1"
max_tokens = 8192
context_window = 32768
# Sent only when set, and only on `kind = "openai"` profiles — recent Claude
# models reject `temperature` with a 400, so the anthropic path never sends it.
# 0 makes runs repeatable, which is what makes failures worth investigating.
temperature = 0

# llama.cpp on the other laptop, reached over the LAN. That server is started
# with --api-key, so LOCAL_LAN_API_KEY must match it.
[providers.local-lan]
kind = "openai"
model = "C:\\Users\\cheng\\models2\\Qwen3-Coder-30B-A3B-Instruct-Q4_0.gguf"
api_key_env = "LOCAL_LAN_API_KEY"
#base_url = "http://192.168.1.29:8080/v1"
base_url = "http://10.9.9.79:8080/v1"
max_tokens = 8192
context_window = 32768
temperature = 0

# GitHub Models. Needs a PAT with the `models:read` scope.
# Model ids are publisher/model — see https://models.github.ai/catalog/models
# For openai/gpt-5* and openai/o* here, set token_param = "max_completion_tokens".
[providers.github]
kind = "openai"
model = "openai/gpt-4.1"
api_key_env = "GITHUB_TOKEN"
base_url = "https://models.github.ai/inference"
# 32768 is this model's actual maximum output; context is 1048576.
max_tokens = 32768
context_window = 1000000
