# Active provider. Override at runtime with AGENT_PROVIDER=openai
provider = "github"

[providers.anthropic]
kind = "anthropic"
model = "claude-opus-4-8"
api_key_env = "ANTHROPIC_API_KEY"
max_tokens = 8192

[providers.openai]
kind = "openai"
model = "gpt-5"
api_key_env = "OPENAI_API_KEY"
max_tokens = 8192
# Newer OpenAI models reject `max_tokens` and want this instead.
token_param = "max_completion_tokens"

[providers.deepseek]
kind = "openai"
model = "deepseek-v4-flash"
api_key_env = "DEEPSEEK_API_KEY"
base_url = "https://api.deepseek.com"
max_tokens = 8192

# GitHub Models. Needs a PAT with the `models:read` scope.
# Model ids are publisher/model — see https://models.github.ai/catalog/models
# For openai/gpt-5* and openai/o* here, set token_param = "max_completion_tokens".
[providers.github]
kind = "openai"
model = "openai/gpt-4.1"
api_key_env = "GITHUB_TOKEN"
base_url = "https://models.github.ai/inference"
max_tokens = 8192
